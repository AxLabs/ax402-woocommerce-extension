name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # GitHub-hosted: `gh` is preinstalled. v0.1.0 failed on self-hosted (`gh: command not found`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash bin/check-version.sh "$TAG"

      - name: Install JS deps
        run: |
          npm ci || npm install
          npm --prefix plugin ci || npm --prefix plugin install

      - name: Build + package plugin zip
        run: npm run package

      - name: WordPress Plugin Check
        uses: ./.github/actions/plugin-check

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP="dist/ax402-for-woocommerce-${VERSION}.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "Missing package artifact: $ZIP" >&2
            ls -la dist || true
            exit 1
          fi

          NOTES="$(mktemp)"
          {
            echo "## Ax402 for WooCommerce ${TAG}"
            echo
            echo "WordPress plugin package: \`$(basename "$ZIP")\`"
            echo
            echo "Install: upload/unzip into \`wp-content/plugins/\` (folder name \`ax402-for-woocommerce\`), or upload the zip via WP Admin → Plugins → Add New."
            echo
            if [[ -f plugin/readme.txt ]]; then
              echo "### Changelog (from readme.txt)"
              echo
              awk -v ver="$VERSION" '
                BEGIN { show=0 }
                /^== Changelog ==/ { in_cl=1; next }
                in_cl && /^= / {
                  if ($0 ~ ("^= " ver " =")) { show=1; print; next }
                  if (show==1) exit
                }
                in_cl && show { print }
              ' plugin/readme.txt
            fi
            echo
            echo "See [RELEASE.md](https://github.com/${{ github.repository }}/blob/main/RELEASE.md) for versioning and release process."
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
