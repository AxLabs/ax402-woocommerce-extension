name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: self-hosted
    steps:
      # Docker PHPUnit can leave root-owned .phpunit.cache; reclaim before checkout clean.
      - name: Reclaim workspace ownership
        run: |
          ws="${GITHUB_WORKSPACE:-.}"
          if [ -e "$ws" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$ws" || true
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Prefer native PHPUnit over Docker so CI does not depend on Docker Desktop.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - name: Install root + plugin JS deps
        run: |
          npm ci || npm install
          npm --prefix plugin ci || npm --prefix plugin install
      - name: JS unit tests
        run: npm run test:js
      - name: PHP unit tests
        run: bash bin/run-phpunit.sh --testsuite Unit

  # GitHub-hosted: wordpress/plugin-check-action needs Docker + a clean wp-env.
  # Do not fold this into the self-hosted unit job.
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root + plugin JS deps
        run: |
          npm ci || npm install
          npm --prefix plugin ci || npm --prefix plugin install
      - name: Build plugin zip
        run: npm run package
      - name: WordPress Plugin Check
        uses: ./.github/actions/plugin-check

  live-cp:
    runs-on: self-hosted
    needs: unit
    steps:
      - name: Reclaim workspace ownership
        run: |
          ws="${GITHUB_WORKSPACE:-.}"
          if [ -e "$ws" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$ws" || true
          fi
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - name: Live control-plane smoke
        env:
          AX402_API_KEY: ${{ secrets.AX402_API_KEY }}
          AX402_BASE_URL: ${{ vars.AX402_BASE_URL }}
          AX402_PAY_TO_ADDRESS: ${{ secrets.AX402_PAY_TO_ADDRESS }}
        run: |
          if [ -z "${AX402_API_KEY:-}" ]; then
            echo "Skipping live-cp: AX402_API_KEY secret is not set."
            exit 0
          fi
          export AX402_BASE_URL="${AX402_BASE_URL:-https://api.ax402.io}"
          bash bin/run-phpunit.sh --testsuite Live
