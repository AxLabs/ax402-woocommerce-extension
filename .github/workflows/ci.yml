name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted: no setup-php (it hangs on this Mac until the 6h GitHub timeout).
  # PHP comes from the runner or Docker via bin/run-phpunit.sh.
  unit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # Docker PHPUnit can leave root-owned .phpunit.cache; reclaim before checkout clean.
      - name: Reclaim workspace ownership
        run: |
          ws="${GITHUB_WORKSPACE:-.}"
          if [ -e "$ws" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$ws" || true
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Require PHP 8.1+ or Docker
        run: |
          set -euo pipefail
          if command -v php >/dev/null 2>&1 && php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'; then
            php -v
            if command -v composer >/dev/null 2>&1; then
              composer -V
            else
              echo "PHP is present but composer is not; bin/run-phpunit.sh will try Docker."
            fi
            exit 0
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "No local PHP 8.1+; bin/run-phpunit.sh will use Docker composer:2."
            exit 0
          fi
          echo "Self-hosted runner needs PHP >= 8.1 and Composer, or a working Docker daemon." >&2
          exit 1
      - name: Install root + plugin JS deps
        run: |
          npm ci || npm install
          npm --prefix plugin ci || npm --prefix plugin install
      - name: JS unit tests
        run: npm run test:js
      - name: PHP unit tests
        run: bash bin/run-phpunit.sh --testsuite Unit

  # Must stay GitHub-hosted: wordpress/plugin-check-action starts wp-env/Docker on Ubuntu.
  plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root + plugin JS deps
        run: |
          npm ci || npm install
          npm --prefix plugin ci || npm --prefix plugin install
      - name: Build plugin zip
        run: npm run package
      - name: WordPress Plugin Check
        uses: ./.github/actions/plugin-check

  live-cp:
    runs-on: self-hosted
    timeout-minutes: 15
    needs: unit
    steps:
      - name: Reclaim workspace ownership
        run: |
          ws="${GITHUB_WORKSPACE:-.}"
          if [ -e "$ws" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$ws" || true
          fi
      - uses: actions/checkout@v4
      - name: Live control-plane smoke
        env:
          AX402_API_KEY: ${{ secrets.AX402_API_KEY }}
          AX402_BASE_URL: ${{ vars.AX402_BASE_URL }}
          AX402_PAY_TO_ADDRESS: ${{ secrets.AX402_PAY_TO_ADDRESS }}
        run: |
          if [ -z "${AX402_API_KEY:-}" ]; then
            echo "Skipping live-cp: AX402_API_KEY secret is not set."
            exit 0
          fi
          export AX402_BASE_URL="${AX402_BASE_URL:-https://api.ax402.io}"
          bash bin/run-phpunit.sh --testsuite Live
